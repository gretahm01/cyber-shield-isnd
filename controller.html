<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06111e">
  <title>Cyber Shield ISND - Control</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at top, #123454, #06111e 58%, #02050b);
      color: #dffcff;
      font-family: ui-monospace, Consolas, monospace;
    }
    main { width: min(100%, 440px); padding: 24px 20px; text-align: center; }
    h1 { margin: 0; color: #00dcf0; font-size: clamp(1.4rem, 6vw, 2rem); text-shadow: 0 0 14px #00dcf088; }
    #status-txt {
      display: inline-block;
      margin: 14px 0 28px;
      padding: 7px 12px;
      border: 1px solid #496376;
      border-radius: 999px;
      color: #90aabd;
      font-size: .75rem;
      letter-spacing: .06em;
    }
    #status-txt.connected { border-color: #00ff88; color: #00ff88; box-shadow: 0 0 14px #00ff8855; }
    .directions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    button {
      min-height: 104px;
      border: 2px solid #00dcf0;
      border-radius: 16px;
      color: #eaffff;
      background: linear-gradient(145deg, #123c5d, #071c31);
      box-shadow: inset 0 0 20px #00dcf022, 0 0 16px #00dcf033;
      font: 700 1rem ui-monospace, Consolas, monospace;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }
    #shoot {
      width: 100%;
      min-height: 145px;
      margin-top: 20px;
      border-color: #00ff88;
      background: linear-gradient(145deg, #12573f, #082d28);
      box-shadow: inset 0 0 28px #00ff8833, 0 0 22px #00ff8844;
      font-size: 1.05rem;
    }
    button:active, button.active { transform: scale(.96); filter: brightness(1.5); box-shadow: 0 0 25px #ffffff99; }
    .hint { margin: 20px 0 0; color: #7090a0; font-size: .75rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>◆ CYBER SHIELD</h1>
    <div id="status-txt">CONECTANDO AL JUEGO...</div>
    <section class="directions" aria-label="Movimiento">
      <button id="left" type="button">◄ IZQUIERDA</button>
      <button id="right" type="button">DERECHA ►</button>
    </section>
    <button id="shoot" type="button">🎯 PARCHE DE SEGURIDAD<br>DISPARAR</button>
    <p class="hint">Mantén presionado para moverte o disparar.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yidmwwckebagxjpidxma.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZG13d2NrZWJhZ3hqcGlkeG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDUxOTgsImV4cCI6MjEwNTYyMTE5OH0.i6ZuT2JvZ9xe1IJV8VJuCf9LkMYVr3Zm2-u2DzzLUsI';
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || '1234';
    const statusElement = document.getElementById('status-txt') || document.querySelector('div');
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const channel = supabaseClient.channel('room_' + roomId, {
      config: { broadcast: { ack: false, self: false } }
    });
    let pingTimer;

    channel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        if (statusElement) {
          statusElement.innerText = '✓ CONECTADO AL JUEGO';
          statusElement.style.color = '#00ff88';
          statusElement.classList.add('connected');
        }
        const sendPing = () => channel.send({ type: 'broadcast', event: 'ping', payload: { alive: true } });
        sendPing();
        clearInterval(pingTimer);
        pingTimer = setInterval(sendPing, 1000);
      }
    });

    window.addEventListener('pagehide', () => clearInterval(pingTimer), { once: true });

    function sendInput(action, state) {
      channel.send({ type: 'broadcast', event: 'input', payload: { action, state } });
    }

    function bindControl(id, action) {
      const button = document.getElementById(id);
      const press = (event) => {
        event.preventDefault();
        button.classList.add('active');
        sendInput(action, true);
      };
      const release = (event) => {
        event.preventDefault();
        button.classList.remove('active');
        sendInput(action, false);
      };
      button.addEventListener('touchstart', press, { passive: false });
      button.addEventListener('touchend', release, { passive: false });
      button.addEventListener('touchcancel', release, { passive: false });
      button.addEventListener('mousedown', press);
      button.addEventListener('mouseup', release);
      button.addEventListener('mouseleave', release);
    }

    bindControl('left', 'left');
    bindControl('right', 'right');
    bindControl('shoot', 'shoot');
  </script>
</body>
</html>
