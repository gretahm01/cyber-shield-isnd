<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Shield Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body { background: #000b14; color: #fff; font-family: monospace; text-align: center; margin: 0; padding: 10px 10px 155px; }
    .title { color: #00ffff; margin: 10px 0 5px; font-size: 18px; }
    #status-box { background: rgba(0,255,136,.1); border: 2px solid #00ff88; color: #00ff88; padding: 10px; border-radius: 8px; margin: 10px auto; font-weight: bold; font-size: 13px; max-width: 300px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px auto; max-width: 320px; }
    .btn { background: #002233; border: 2px solid #00ffff; color: #fff; font: bold 16px monospace; padding: 20px 10px; border-radius: 8px; cursor: pointer; }
    .btn:active { background: #00ff88; color: #000; }
    .btn-shoot { background: #ff0055; border-color: #ff0055; grid-column: span 2; padding: 22px; font-size: 18px; color: #fff; }
    .btn-shoot:active { background: #ff5588; }
    #mobile-debug { position: fixed; bottom: 0; left: 0; right: 0; height: 140px; overflow-y: auto; background: #000; color: #00ff88; border-top: 2px solid #00ff88; padding: 8px; font-size: 11px; text-align: left; z-index: 999999; word-break: break-all; pointer-events: none; }
  </style>
</head>
<body>
  <div class="title">◆ CYBER SHIELD CONTROL ◆</div>
  <div id="status-box">INICIANDO CONTROL...</div>

  <div class="btn-grid">
    <button class="btn" id="btn-left" type="button">◄ IZQUIERDA</button>
    <button class="btn" id="btn-right" type="button">DERECHA ►</button>
    <button class="btn btn-shoot" id="btn-shoot" type="button">🎯 PARCHE DE SEGURIDAD</button>
  </div>

  <div id="mobile-debug"><b>[LOG DE DEPURACIÓN EN VIVO]</b></div>

  <script>
    function log(msg, err = false) {
      const box = document.getElementById('mobile-debug');
      if (!box) return;

      const div = document.createElement('div');
      div.style.color = err ? '#ff0055' : '#00ff88';
      div.innerText = (err ? '[ERR] ' : '[OK] ') + msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      console.log(msg);
    }

    window.onerror = function (message, url, line) {
      log('Error script L' + line + ': ' + message, true);
    };

    log('Página cargada correctamente.');

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    const statusBox = document.getElementById('status-box');
    window.sendControl = () => {};

    log('Sala en URL: ' + (roomId || 'NO DETECTADA'));

    if (!roomId) {
      log('ERROR: La URL no contiene número de sala.', true);
      statusBox.innerText = 'ERROR DE SALA';
    } else if (!window.supabase) {
      log('ERROR: Librería Supabase no disponible.', true);
      statusBox.innerText = 'ERROR CDN SUPABASE';
    } else {
      const SUPABASE_URL = 'https://yidmwwckebagxjpidxma.supabase.co'.trim();
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZG13d2NrZWJhZ3hqcGlkeG1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDUxOTgsImV4cCI6MjEwNTYyMTE5OH0.i6ZuT2JvZ9xe1IJV8VJuCf9LkMYVr3Zm2-u2DzzLUsI'.trim();

      try {
        const sp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: false }
        });
        log('Cliente Supabase creado.');

        const channel = sp.channel('room_' + roomId);
        let pingTimer;

        channel
          .on('broadcast', { event: 'PC_PONG' }, () => {
            log('¡PC RESPONDIÓ! Conectado con éxito.');
            statusBox.innerText = '✓ JUEGO CONECTADO (SALA ' + roomId + ')';
            statusBox.style.borderColor = '#00ff88';
          })
          .subscribe((status, error) => {
            log('Estado Canal: ' + status);

            if (error || status === 'CHANNEL_ERROR') {
              const detail = error ? JSON.stringify(error) : 'Servidor rechazó el canal';
              log('Detalle error: ' + detail, true);
              statusBox.innerText = 'ERROR EN CANAL SUPABASE';
              statusBox.style.borderColor = '#ff0055';
              clearInterval(pingTimer);
              return;
            }

            if (status === 'SUBSCRIBED') {
              statusBox.innerText = 'BUSCANDO JUEGO EN SALA ' + roomId + '...';
              log('Enviando PING a la PC cada 800 ms.');

              clearInterval(pingTimer);
              pingTimer = setInterval(() => {
                channel.send({
                  type: 'broadcast',
                  event: 'MOBILE_PING',
                  payload: { room: roomId }
                });
              }, 800);
            }
          });

        function sendCmd(action, state) {
          log('Entrada: ' + action + ' = ' + state);
          channel.send({
            type: 'broadcast',
            event: 'GAME_INPUT',
            payload: { action, state }
          });
        }

        window.sendControl = sendCmd;

        const bindBtn = (id, action) => {
          const element = document.getElementById(id);
          if (!element) return;

          const start = (event) => { event.preventDefault(); sendCmd(action, true); };
          const end = (event) => { event.preventDefault(); sendCmd(action, false); };

          element.addEventListener('touchstart', start, { passive: false });
          element.addEventListener('touchend', end, { passive: false });
          element.addEventListener('touchcancel', end, { passive: false });
          element.addEventListener('mousedown', start);
          element.addEventListener('mouseup', end);
          element.addEventListener('mouseleave', end);
        };

        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        bindBtn('btn-shoot', 'shoot');
      } catch (error) {
        log('Excepción Supabase: ' + error.message, true);
      }
    }
  </script>
</body>
</html>
