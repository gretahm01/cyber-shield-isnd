<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Shield ISND</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at top, #102a4b 0%, #050914 55%, #02040a 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    #game-container {
      width: min(100vw, 1000px);
      aspect-ratio: 16 / 9;
      border: 1px solid #20dcff;
      box-shadow: 0 0 22px #20dcff66, inset 0 0 30px #0a6f9e33;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Cyber Shield ISND"></main>
  <div id="qr-modal" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background: rgba(0, 15, 30, 0.95); border: 2px solid #00ff88; padding: 20px; border-radius: 12px; text-align: center; font-family: monospace; color: #ffffff; box-shadow: 0 0 20px #00ff88; min-width: 260px;">
    <h3 style="margin-top:0; color:#00ff88;">CONTROLLER MÓVIL</h3>
    <p style="font-size: 11px; margin-bottom: 8px;">Escanea con tu celular (Datos 4G/5G o Wi-Fi):</p>
    <div style="background: white; padding: 10px; display: inline-block; border-radius: 8px; margin: 5px 0;">
      <canvas id="qr-canvas" width="160" height="160" style="display: block;"></canvas>
    </div>
    <div id="room-code-display" style="font-size: 13px; color: #00ffff; font-weight: bold; margin: 8px 0;">SALA: ----</div>
    <p style="font-size: 10px; color: #aaa; margin-bottom: 12px;">URL: <span id="controller-url-text" style="color:#fff;">...</span></p>
    <button id="close-qr-btn" style="background: #ff0055; color: white; border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 4px; width: 100%;">JUGAR CON TECLADO</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
</body>
</html>
