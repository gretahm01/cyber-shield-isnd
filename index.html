<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Shield ISND</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at top, #102a4b 0%, #050914 55%, #02040a 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    #game-container {
      width: min(100vw, 1000px);
      aspect-ratio: 16 / 9;
      border: 1px solid #20dcff;
      box-shadow: 0 0 22px #20dcff66, inset 0 0 30px #0a6f9e33;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Cyber Shield ISND"></main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
</body>
</html>
